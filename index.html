<!DOCTYPE html>
<html>
<head>
    <title>3D Модель</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        model-viewer {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <model-viewer 
        src="models/rack.glb" 
        alt="3D модель"
        auto-rotate 
        camera-controls
        background-color="#f0f0f0"
        shadow-intensity="1">
    </model-viewer>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
    </script>
</body>
</html>
